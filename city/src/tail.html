</script>

<script id="nlsTitleBridge">
/* Non-invasive bridge: only forwards clicks to the game's EXISTING functions and buttons. */
(function(){
  'use strict';
  const landing=document.getElementById('nlsLanding');
  const legacy=document.getElementById('title');
  const back=document.getElementById('nlsBackFloat');
  const panel=document.getElementById('nlsSettingsPanel');
  const note=document.getElementById('nlsNote');
  if(!landing||!legacy)return;
  let opened=false;
  let noticeHandle;
  function ready(){return !!legacy.querySelector('.card.setup')}
  function refresh(){
    if(ready()) landing.dataset.ready='1';
    // Keep the setup heading consistent with the new front-screen title.
    const heading=legacy.querySelector(':scope > h1');
    if(heading && heading.textContent!=='人生物語｜この街で、生きる。')heading.textContent='人生物語｜この街で、生きる。';
    const showingSetup=opened && legacy.style.display!=='none';
    back.classList.toggle('on',showingSetup);
    if(opened && legacy.style.display==='none')opened=false;
    // Save-slot and file imports can launch the game without passing through openSetup.
    if(legacy.style.display==='none' && window.NLS && window.NLS.G)landing.classList.add('nls-hidden');
  }
  const observer=new MutationObserver(refresh);
  observer.observe(legacy,{childList:true,attributes:true,attributeFilter:['style']});
  refresh();
  function inform(msg){
    note.textContent=msg;note.classList.add('on');
    clearTimeout(noticeHandle);
    noticeHandle=setTimeout(()=>note.classList.remove('on'),3300);
  }
  function openSetup(step){
    if(!ready()){inform('ゲームデータの準備中です。');return}
    landing.classList.add('nls-hidden');
    panel.classList.remove('on');panel.setAttribute('aria-hidden','true');
    opened=true;
    legacy.style.display='flex';
    if(typeof step==='number'){
      const tab=legacy.querySelector('[data-step="'+step+'"]');
      if(tab)tab.click();
    }
    refresh();
  }
  function clickLegacy(label){
    const buttons=Array.from(legacy.querySelectorAll('button.btn'));
    const button=buttons.find(b=>b.textContent.trim()===label);
    if(button){button.click();return true}
    return false;
  }
  function openSettings(){
    if(window.NLSAudio){
      document.getElementById('nlsAudioToggle').checked=!!window.NLSAudio.enabled;
      document.getElementById('nlsMusicToggle').checked=!!window.NLSAudio.bgm;
    }
    document.getElementById('nlsLargeTextToggle').checked=document.body.classList.contains('big');
    panel.classList.add('on');panel.setAttribute('aria-hidden','false');
    panel.querySelector('.nls-close').focus();
  }
  landing.addEventListener('click',function(ev){
    const b=ev.target.closest('button[data-nls-action]');
    if(!b)return;
    const action=b.dataset.nlsAction;
    if(action==='close'){panel.classList.remove('on');panel.setAttribute('aria-hidden','true');return}
    if(action==='settings'){openSettings();return}
    if(!ready()){inform('ゲームデータを準備中です。');return}
    if(action==='new'){openSetup(0);return}
    if(action==='trial'){
      if(/[?&]public=1(?:&|$)/.test(location.search)){inform('公開表示では試験モードを利用できません。');return}
      openSetup(2);
      if(!legacy.querySelector('[data-s="max"]'))inform('この版では開発試験の設定が無効です。');
      return;
    }
    if(action==='continue'){
      if(!clickLegacy('つづきから'))inform('保存データはありません。新しい人生、またはファイルから読み込んでください。');
      return;
    }
    if(action==='import'){
      panel.classList.remove('on');panel.setAttribute('aria-hidden','true');
      if(!clickLegacy('ファイルから読み込む'))inform('保存ファイルの読み込み機能を準備できませんでした。');
    }
  });
  document.getElementById('nlsAudioToggle').addEventListener('change',e=>{window.NLSAudio?.set(e.target.checked)});
  document.getElementById('nlsMusicToggle').addEventListener('change',e=>{window.NLSAudio?.setBgm(e.target.checked)});
  document.getElementById('nlsLargeTextToggle').addEventListener('change',e=>{document.body.classList.toggle('big',e.target.checked)});
  back.addEventListener('click',()=>{
    legacy.style.display='none';
    opened=false;
    back.classList.remove('on');
    landing.classList.remove('nls-hidden');
    panel.classList.remove('on');panel.setAttribute('aria-hidden','true');
  });
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!panel.classList.contains('on')&&opened&&legacy.style.display!=='none')back.click();
    else if(e.key==='Escape'&&panel.classList.contains('on')){panel.classList.remove('on');panel.setAttribute('aria-hidden','true')}
  });
})();
</script>
</body>
</html>
